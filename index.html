<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>T3 Coquelicots</title>
  <meta name="description" content="Maquette 3D du T3 : vue 3D, plan et visite à pied.">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M4 15 16 5l12 10v12H4z' fill='%23c2410c'/%3E%3Crect x='13' y='19' width='6' height='8' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>
</head>
<body class="locked">
  <header class="bar">
    <div class="brand">
      <span class="logo" aria-hidden="true"></span>
      <div>
        <h1>T3 Coquelicots</h1>
        <p id="subtitle">Chargement…</p>
      </div>
    </div>
    <nav class="modes" role="tablist" aria-label="Mode d'affichage">
      <button role="tab" data-mode="orbit" aria-selected="true">Vue 3D</button>
      <button role="tab" data-mode="plan" aria-selected="false">Plan</button>
      <button role="tab" data-mode="walk" aria-selected="false">Visite</button>
    </nav>
    <button id="lockBtn" class="lock" title="Verrouiller (oublier le mot de passe sur cet appareil)" aria-label="Verrouiller" hidden>
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
    </button>
  </header>

  <main class="stage">
    <canvas id="view" aria-label="Maquette 3D"></canvas>
    <div id="plan" class="plan" hidden></div>
    <div id="minimap" class="minimap" hidden></div>
    <div id="tip" class="tip" hidden></div>
    <div id="joy" class="joy" hidden><div class="knob"></div></div>
    <p id="help" class="help"></p>
    <div id="loading" class="loading"><div class="spinner"></div><span id="loadtext">Chargement de la maquette…</span></div>
    <div id="gate" class="gate" hidden>
      <form id="gateForm" class="gate-card" autocomplete="on">
        <span class="logo big" aria-hidden="true"></span>
        <h2>Accès réservé</h2>
        <p>Entrez le mot de passe pour voir la maquette.</p>
        <input type="text" name="username" value="t3" autocomplete="username" hidden>
        <input id="gatePw" type="password" name="password" placeholder="Mot de passe" autocomplete="current-password" required aria-label="Mot de passe">
        <label class="opt"><input type="checkbox" id="gateRemember" checked> Se souvenir sur cet appareil</label>
        <button type="submit">Entrer</button>
        <p id="gateErr" class="err" role="alert"></p>
      </form>
    </div>

    <aside class="panel" id="panel">
      <button class="panel-toggle" id="panelToggle" aria-expanded="true" aria-controls="panelBody">
        <span>Pièces</span><span class="total" id="totalArea"></span>
      </button>
      <div class="panel-body" id="panelBody">
        <ul class="rooms" id="rooms"></ul>
        <div class="opts">
          <label class="opt" data-for="orbit walk"><input type="checkbox" id="optDoors"> Ouvrir portes et fenêtres</label>
        </div>
        <p class="note">Surfaces calculées depuis la maquette (axe des murs moins une demi-épaisseur).</p>
      </div>
    </aside>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
